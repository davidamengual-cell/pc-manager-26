save();tab='Resultados';render()}function go(t){tab=t;render()}function toggle(i){s.players[i].on=!s.players[i].on;save();render()}function buy(i){let p=s.market[i],v=val(p);if(s.cash<v)return alert('Presupuesto insuficiente');s.cash-=v;s.players.push(p);s.market.splice(i,1);save();render()}function sell(i){if(s.players.length<=11)return alert('Plantilla mínima de 11');s.cash+=val(s.players[i]);s.players.splice(i,1);save();render()}function table(h,rows){return '<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>'}function render(){if(s)init2();if(!s){app.innerHTML='<section><h2>Nueva partida</h2><p>Modo de juego</p><select id=mode onchange="filterClubs()"><option value=classic>Mánager</option><option value=pro>ProManager</option></select><p>Elige tu club</p><select id=club>'+names.concat(second).map((n,i)=>`<option value=${i}>${i<20?"1ª":"2ª"} · ${n}</option>`).join('')+'</select> <button class=primary onclick=start()>Empezar</button><p><small>Base parcial: 6 plantillas con nombres reales; las demás ficticias. Edades y medias simuladas. Solo las nuevas partidas usan las divisiones actualizadas. Tres ascensos directos y tres descensos; sin playoff.</small></p></section>';return}let c=s.clubs[s.id],rank=ranking(c.div);let pair=s.schedule[s.week]?.find(p=>p.includes(s.id));app.innerHTML=`<section><h2>${c.name}</h2>${s.year}/${String(s.year+1).slice(-2)} · Jornada ${s.week}/42 · ${c.div}ª División · ${rank.indexOf(c)+1}º · Caja: <b>${money(s.cash)}</b></section><nav>${['Inicio','Plantilla','Tácticas','Fichajes','Clasificación','Calendario','Economía','Resultados','Goleadores','Historial','Carrera','Partida'].map(t=>`<button onclick="go('${t}')" class="${tab===t?'primary':''}">${t}</button>`).join('')}</nav><section id=content></section><button class=primary onclick=play()>${s.week===42?'Nueva temporada':'Jugar jornada'}</button>`;let el=document.getElementById('content');if(tab==='I ','Cádiz','Granada','Almería','Eibar','Huesca','Burgos','Mirandés','Albacete','Córdoba','Castellón','Racing Santander','Racing Ferrol','Tenerife','Las Palmas','Leganés','Valladolid','Ceuta','Cultural Leonesa']).forEach((name,i)=>s.clubs.push({name,div:2,q:quality(i+20),p:0,w:0,d:0,l:0,gf:0,ga:0}));let previous=s.schedule;buildSchedule();if(old&&previous.length===38){for(let i=0;i<38;i++)s.schedule[i]=[...previous[i],...s.schedule[i].filter(([a])=>a>=20)];for(let i=0;i<s.week;i++)for(let [a,b] of s.schedule[i].filter(([a])=>a>=20)){let x=goals(1.5),y=goals(1.1);for(let [j,g,h] of [[a,x,y],[b,y,x]]){let c=s.clubs[j];c.gf+=g;c.ga+=h;c.p+=g>h?3:g===h?1:0;c[g>h?"w":g===h?"d":"l"]++}}}save();}if(!s.history)s.history=[];if(!s.career)s.career={mode:'classic',rep:25,offers:[],log:[],assets:{}};s.players.forEach(p=>{if(!Number.isFinite(p.goals))p.goals=0});}function record2(){let r=s.results.find(r=>r.a===s.id||r.b===s.id);if(!r)return;let n=r.a===s.id?r.x:r.y;let pool=s.players.filter(p=>p.on&&p.pos!=='POR');let weighted=pool.flatMap(p=>Array(p.pos==='DEL'?5:p.pos==='MED'?3:1).fill(p));for(let i=0;i<n&&weighted.length;i++)weighted[rnd(weighted.length)].goals++;}function finish2(){let rank=ranking(s.clubs[s.id].div);s.history.push({year:s.year,champion:ranking(1)[0].name,rank:rank.indexOf(s.clubs[s.id])+1,division:s.clubs[s.id].div});s.players.forEach(p=>p.goals=0);}
function filterClubs(){let pro=document.getElementById('mode').value==='pro',c=document.getElementById('club');for(let o of c.options)o.disabled=pro&&+o.value<30;if(pro&&+c.value<30)c.value='30';}
function careerEnd(){let c=s.clubs[s.id],r=ranking(c.div).indexOf(c)+1,k=s.career;let expected=1+s.clubs.filter(x=>x.div===c.div&&x.q>c.q).length;let delta=Math.max(-15,Math.min(20,(expected-r)*2+(r<=3?8:0)));k.rep=Math.max(0,Math.min(100,k.rep+delta));k.log.push({year:s.year,club:c.name,division:c.div,rank:r,delta,rep:k.rep});k.offers=[];if(k.mode==='pro'){let cap=60+k.rep*.35;let candidates=s.clubs.map((x,i)=>({x,i})).filter(({x,i})=>i!==s.id&&x.q<=cap&&x.q>=c.q-5).sort((a,b)=>b.x.q-a.x.q);k.offers=candidates.slice(0,3).map(({i})=>i);}}
