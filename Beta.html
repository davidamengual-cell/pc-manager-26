function finance(){s.finances=s.finances||{};return s.finances[s.id]||(s.finances[s.id]={year:s.year,opening:s.cash,entries:{},debt:0,sponsor:0,level:1,last:-1});}
function financePost(k,v){let f=finance();v=Math.round(v);s.cash+=v;f.entries[k]=(f.entries[k]||0)+v;}
function operatingCost(c,stadium,level=1){return Math.round(stadium*(c.div===1?8:3)*(1+.12*(level-1))+ (c.div===1?85000:15000));}
function tvIncome(c){return Math.round((c.div===1?780000:175000)*Math.max(.85,Math.min(1.65,1+(c.q-75)*.035)));}
function sponsorIncome(c){return Math.round((c.div===1?180000:45000)*Math.max(.75,Math.min(2.5,1+(c.q-75)*.07)));}
function sportingPrize(c){let rank=ranking(c.div).indexOf(c);return Math.round((c.div===1?6000000:1200000)*(1-rank/(c.div===1?20:22)));}

function fanBase(c){return Math.round(9000*Math.pow(1.075,c.q-65));}
function fanHistory(c){return Number.isFinite(c.fanBase)&&c.fanBase>0?c.fanBase:fanBase(c);}
function updateFans(){for(let div of [1,2]){let list=ranking(div);list.forEach((c,i)=>{if(c.fanYear===s.year)return;let n=list.length,performance=1-2*i/(n-1),change=performance*.045;if(div===1&&i>=n-3)change-=.045;if(div===2&&list.filter(x=>!["Celta Fortuna","Real Sociedad B"].includes(x.name)).slice(0,3).includes(c))change+=.055;let base=fanBase(c);c.fanBase=Math.round(Math.max(base*.55,Math.min(base*2.5,fanHistory(c)*(1+change))));c.fanYear=s.year;});}}

function scheduledPrincipal(){let f=finance();return Math.min(f.debt,Math.ceil((f.debtBase||f.debt)/260));}

function financeTick(){let f=finance(),c=s.clubs[s.id];if(f.last===s.year*100+s.week)return;f.last=s.year*100+s.week;let home=s.results.some(r=>r.a===s.id),played=s.results.some(r=>r.a===s.id||r.b===s.id),attendance=crowd(c,s.stadium,s.ticket),fans=attendance.fans,subs=attendance.subs;if(home){financePost('Taquilla',Math.max(0,fans-subs)*s.ticket);financePost('Abonos',subs*s.ticket*.65);}if(played){financePost('Televisión',tvIncome(c));financePost('Patrocinio',f.sponsor||Math.round(sponsorIncome(c)*.75));}financePost('Merchandising',merchandise(c,f.level));financePost('Salarios',-payroll(s.players));financePost('Mantenimiento',-operatingCost(s.clubs[s.id],s.stadium,f.level));if(f.debt||s.cash<0)financePost('Intereses',-(f.debt*.06+Math.max(0,-s.cash)*.08)/52);autoRefinance();amortizeScheduled();}

function expansionCost(){return Math.min(5000,100000-s.stadium)*1200;}
function creditLimit(){let c=s.clubs[s.id],n=seasonLength();return Math.max(1000000,Math.floor(n*(tvIncome(c)+sponsorIncome(c)*.75)*.25/1000000)*1000000);}
function expansionReturn(){let c=s.clubs[s.id],n=seasonLength(),extra=Math.max(0,Math.min(5000,100000-s.stadium)),f=finance();let revenue=n/2*(crowd(c,s.stadium+extra,s.ticket).revenue-crowd(c,s.stadium,s.ticket).revenue);let cost=52*(operatingCost(c,s.stadium+extra,f.level)-operatingCost(c,s.stadium,f.level));let net=revenue-cost;return {net,years:net>0?expansionCost()/net:Infinity};}
function budgetView(){let b=budgetForecast();return '<h3>Previsión hasta final de temporada</h3>'+table(['Concepto','Importe'],[['Ingresos pendientes',money(b.income)],['Gastos pendientes',money(b.costs)],['Resultado pendiente',money(b.net)],['Caja prevista',money(b.closing)]])+'<p>Estimación sin premios ni futuros traspasos; asistencia aproximada.</p>';}
function financeAction(k){let f=finance(),c=s.clubs[s.id];if(k==='sponsor'){if(f.sponsor)return;f.sponsor=sponsorIncome(c);}if(k==='expand'){if(expansionReturn().net<=0)return alert("Ampliación no rentable con la demanda actual");if(s.stadium>=100000||!affordableBudget(expansionCost(),payroll(s.players),Math.min(100000,s.stadium+5000)))return alert('Fondos insuficientes o aforo máximo');financePost('Estadio',-expansionCost());s.stadium=Math.min(100000,s.stadium+5000);}if(k==='upgrade'){let cost=f.level*500000;if(f.level>=5||!affordableBudget(cost,payroll(s.players),s.stadium,f.level+1))return alert('Fondos insuficientes o nivel máximo');financePost('Estadio',-cost);f.level++;}if(k==='loan'){if(f.debt+1000000>creditLimit())return alert('Límite de crédito alcanzado');f.debt+=1000000;f.debtBase=f.debt;financePost('Préstamos',1000000);}if(k==='repay'){let n=Math.min(f.debt,1000000);if(!n||s.cash<n)return alert('Sin deuda o fondos insuficientes');f.debt-=n;financePost('Amortización',-n);}save();render();}
function financeView(){let f=finance(),b=budgetForecast(),c=s.clubs[s.id],attendance=crowd(c,s.stadium,s.ticket),net=Object.values(f.entries).reduce((a,b)=>a+b,0);return `<h2>Economía y estadio</h2><p>Dinero disponible: <b>${money(s.cash)}</b> · Deuda: ${money(f.debt)}</p><p>Saldo previsto al final de temporada: ${money(b.closing)}</p>${s.cash<0||b.closing<0?'<p><b>Atención:</b> reduce gastos o vende jugadores antes de fichar.</p>':''}<p>Salarios semanales: ${money(payroll(s.players))} · Estadio: ${attendance.fans} / ${s.stadium} espectadores estimados · Instalaciones: ${f.level}/5</p><label>Precio entrada <input type=number min=5 max=100 value=${s.ticket} onchange="s.ticket=Math.max(5,Math.min(100,+this.value||25));save();render()"></label><p><button onclick="financeAction('expand')">Ampliar estadio · ${money(expansionCost())}</button> <button onclick="financeAction('upgrade')">Mejorar instalaciones · ${money(f.level*500000)}</button></p><p><button onclick="financeAction('sponsor')" ${f.sponsor?'disabled':''}>${f.sponsor?'Patrocinio firmado':'Firmar patrocinio'}</button> <button onclick="financeAction('loan')">Solicitar préstamo de 1 M€</button></p><details><summary>Ver balance económico</summary>${table(['Concepto','Importe'],[['Caja inicial',money(f.opening)],...Object.entries(f.entries).map(([k,v])=>[k,money(v)]),['Otros movimientos',money(s.cash-f.opening-net)],['Caja final',money(s.cash)]])}</details>`;}
function autoRefinance(){let f=finance(),amount=Math.min(Math.max(0,-s.cash),Math.max(0,creditLimit()-f.debt));if(amount>0){f.debt+=amount;f.debtBase=f.debt;financePost('Refinanciación',amount);}return amount;}

let live=null,liveTimer=null;
function liveStart(){if(live||s.week>=seasonLength())return;if(!s.schedule[s.week]?.some(p=>p.includes(s.id)))return play();if(s.players.filter(p=>p.on).length!==11)return alert('Selecciona 11 titulares');let pair=s.schedule[s.week]?.find(p=>p.includes(s.id));if(!pair)return play();let home=pair[0]===s.id;live={pair,home,min:0,g:[0,0],shots:[0,0],pos:0,events:[],xi:s.players.map((p,i)=>p.on?i:-1).filter(i=>i>=0),used:[],subs:0,tactic:'equilibrada',speed:350,ratings:{},scorers:[],cards:{},injured:[]};live.xi.forEach(i=>live.ratings[i]=6);liveView();}
function liveView(){let m=live;if(!m)return;let esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');let own=m.home?0:1;let bench=s.players.map((p,i)=>i).filter(i=>!m.xi.includes(i)&&!m.used.includes(i));app.innerHTML=`<section class="live-screen"><div class="live-score"><div>${esc(s.clubs[m.pair[0]].name)}</div><strong>${m.g[0]} – ${m.g[1]}</strong><div>${esc(s.clubs[m.pair[1]].name)}</div></div><p id="live-minute">${m.min}' / 90 · ${m.subs}/5 cambios</p><progress id="live-progress" max=90 value=${m.min}></progress><div id="live-stats"></div><div class="live-controls"><button onclick="liveRun()">Continuar</button><button onclick="livePause()">Pausa</button><button onclick="liveFinish()">Simular resto</button></div><p>Velocidad <select onchange="live.speed=+this.value; if(liveTimer)liveRun()">${[1000,350,80].map((v,i)=>`<option value=${v} ${m.speed===v?'selected':''}>${['Normal','Rápida','Muy rápida'][i]}</option>`).join('')}</select></p><div class="live-controls">${['defensiva','equilibrada','ofensiva'].map(v=>`<button data-live-tactic="${v}" aria-pressed="${m.tactic===v}" onclick="liveTactic('${v}')">${v}</button>`).join('')}</div><button onclick="liveSub()" ${m.subs>=5?'disabled':''}>Sustituir jugador</button><div id="live-sub"></div><h3>Retransmisión</h3><div id="live-events" class="live-events"></div><details><summary>Valoraciones</summary><div id="live-ratings"></div></details></section>`;liveRefresh();}
function liveRefresh(){let m=live;if(!m)return;let el=id=>document.getElementById(id);if(!el('live-minute'))return;let esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');let score=app.querySelector('.live-score strong');if(score)score.textContent=m.g.join(' – ');el('live-minute').textContent=m.min+"' / 90 · "+m.subs+'/5 cambios';el('live-progress').value=m.min;el('live-stats').textContent='Disparos: '+m.shots.join(' – ')+' · Posesión local: '+(m.min?Math.round(m.pos/m.min):50)+'%';el('live-events').innerHTML=m.events.slice(-15).reverse().map(e=>`<p>${esc(e)}</p>`).join('')||'<p>Esperando acontecimientos…</p>';el('live-ratings').innerHTML=table(['Jugador','Nota'],Object.entries(m.ratings).map(([i,r])=>[esc(s.players[i].name),r.toFixed(1)]));}
function liveTactic(v){if(!live)return;live.tactic=v;app.querySelectorAll('[data-live-tactic]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.liveTactic===v)));}
function livePause(){clearInterval(liveTimer);liveTimer=null;}
function liveRun(){livePause();if(live){let panel=document.getElementById('live-sub');if(panel)panel.innerHTML='';liveTimer=setInterval(()=>liveStep(),live.speed);}}
function liveSub(){livePause();let m=live;if(!m||m.subs>=5)return;let panel=document.getElementById('live-sub');let esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');let bench=s.players.map((p,i)=>i).filter(i=>!m.xi.includes(i)&&!m.used.includes(i));panel.innerHTML=`<label>Sale <select id="live-out">${m.xi.map(i=>`<option value="${i}">${esc(s.players[i].name)} (${s.players[i].pos})</option>`).join('')}</select></label><label>Entra <select id="live-in">${bench.map(i=>`<option value="${i}">${esc(s.players[i].name)} (${s.players[i].pos})</option>`).join('')}</select></label><button onclick="liveConfirmSub()" ${bench.length?'':'disabled'}>Confirmar cambio</button><button onclick="document.getElementById('live-sub').innerHTML=''">Cancelar</button>`;}
function liveConfirmSub(){let m=live;if(!m||m.subs>=5)return;let out=+document.getElementById('live-out').value,inc=+document.getElementById('live-in').value;if(!m.xi.includes(out)||m.xi.includes(inc)||m.used.includes(inc)||!s.players[inc])return;m.xi=m.xi.map(i=>i===out?inc:i);m.used.push(out);m.ratings[inc]=6;m.subs++;m.events.push(m.min+"' Cambio: "+s.players[inc].name+' por '+s.players[out].name);liveView();}
function liveStep(draw=true){let m=live;if(!m)return;m.min++;let own=m.home?0:1,opp=1-own;let q=m.xi.reduce((a,i)=>a+s.players[i].q-(m.injured.includes(i)?15:0),0)/11;let diff=(q-strength(m.pair[opp]))/18;let attack=m.tactic==='ofensiva'?1.25:m.tactic==='defensiva'?.75:1;let rates=[];rates[own]=Math.max(.25,(1.3+diff)*attack);rates[opp]=Math.max(.25,(1.3-diff)*(2-attack));m.pos+=Math.max(25,Math.min(75,50+(m.home?1:-1)*diff*8));for(let side=0;side<2;side++){if(Math.random()<rates[side]*7/90){m.shots[side]++;if(Math.random()<.145){m.g[side]++;let name=s.clubs[m.pair[side]].name;if(side===own){let pool=m.xi.filter(i=>s.players[i].pos!=='POR');let i=pool[rnd(pool.length)];if(i!==undefined){m.scorers.push(i);m.ratings[i]=Math.min(10,m.ratings[i]+.8);name=s.players[i].name;}}m.events.push(m.min+"' ¡GOL! "+name);}else m.events.push(m.min+"' Disparo de "+s.clubs[m.pair[side]].name);}}if(Math.random()<.025){let i=m.xi[rnd(m.xi.length)];m.cards[i]=(m.cards[i]||0)+1;m.ratings[i]=Math.max(3,m.ratings[i]-.3);m.events.push(m.min+"' Amarilla: "+s.players[i].name);}if(Math.random()<.003){let i=m.xi[rnd(m.xi.length)];if(!m.injured.includes(i)){m.injured.push(i);m.events.push(m.min+"' Molestias: "+s.players[i].name);}}if(m.min>=90){livePause();m.scorers.forEach(i=>s.players[i].goals=(s.players[i].goals||0)+1);s.lastLive={events:m.events,ratings:Object.entries(m.ratings).map(([i,r])=>[s.players[i].name,r.toFixed(1)]),score:m.g,shots:m.shots};live=null;play(m);return;}if(draw)liveRefresh();}
function liveFinish(){livePause();while(live)liveStep(false);}


function uiEsc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function navIcon(t){return ({Inicio:'⌂',Plantilla:'♟',Tácticas:'▦',Fichajes:'⇄',Contratos:'▤',Cesiones:'↔',Cantera:'★',Clasificación:'▥',Calendario:'▦',Economía:'€',Resultados:'✓',Goleadores:'⚽',Historial:'◷',Carrera:'◆',Partida:'▣'})[t]||'';}
function deskView(c,rank){let r=(s.results||[]).find(r=>r.a===s.id||r.b===s.id);return `<div class="desk-grid"><div class="desk-tile">Clasificación<strong>${rank.indexOf(c)+1}º</strong></div><div class="desk-tile">Caja<strong>${money(s.cash)}</strong></div><div class="desk-tile">Puntos<strong>${c.p}</strong></div></div><h3>Noticias del club</h3><div class="news-item">${r?uiEsc(s.clubs[r.a].name)+' '+r.x+' – '+r.y+' '+uiEsc(s.clubs[r.b].name):'Comienza una nueva campaña.'}</div><div class="news-item">${s.players.filter(p=>p.on).length} titulares seleccionados · Formación ${uiEsc(s.formation)}</div>`;}
function pitchView(){return '<div class="pitch" aria-label="Alineación sobre el campo">'+['DEL','MED','DEF','POR'].map(pos=>'<div class="pitch-row">'+s.players.map((p,i)=>({p,i})).filter(({p})=>p.on&&p.pos===pos).map(({p,i})=>`<button onclick="playerCard(${i})">${uiEsc(p.name)}<b>${p.q}</b></button>`).join('')+'</div>').join('')+'</div>';}
function playerCard(i){let p=s.players[i];if(!p)return;document.getElementById('playerDialog')?.remove();let d=document.createElement('dialog');d.id='playerDialog';d.innerHTML=`<h2>${uiEsc(p.name)}</h2><p>${uiEsc(p.role||p.pos)} · ${p.age} años</p><p>Media: <b>${p.q}</b> · Potencial: ${potential(p)}</p><p>Valor: ${money(val(p))}</p><p>Goles: ${p.goals||0} · ${p.on?'Titular':'Suplente'}</p><form method="dialog"><button class="primary">Cerrar</button></form>`;document.body.append(d);d.showModal();}


let selectedStarter=null;
function chooseStarter(i){if(!s.players[i]?.on)return;selectedStarter=selectedStarter===i?null:i;render();}
function swapStarter(i){let a=s.players[selectedStarter],b=s.players[i];if(selectedStarter===null||!a?.on||!b||b.on||a.pos!==b.pos)return; a.on=false;b.on=true;selectedStarter=null;save();render();}
function changeFormation(f){if(!['4-4-2','4-3-3','3-5-2','5-3-2'].includes(f))return;s.formation=f;selectedStarter=null;auto();save();render();}
function tacticsView(){let a=s.players[selectedStarter];if(!a?.on)selectedStarter=null;let count=s.players.filter(p=>p.on).length;return `<h2>Tácticas</h2><div class="formation-buttons">${['4-4-2','4-3-3','3-5-2','5-3-2'].map(f=>`<button class="${s.formation===f?'primary':''}" aria-pressed="${s.formation===f}" onclick="changeFormation('${f}')">${f}</button>`).join('')}</div><p><b>${count}/11 titulares</b> · <button onclick="changeFormation(s.formation)">Mejor once</button></p><p>${selectedStarter===null?'Pulsa un titular para cambiarlo.':'Elige un suplente de la misma posición.'}</p><div class="pitch touch-pitch">${['DEL','MED','DEF','POR'].map(pos=>`<div class="pitch-row">${s.players.map((p,i)=>({p,i})).filter(x=>x.p.on&&x.p.pos===pos).map(({p,i})=>`<button class="${selectedStarter===i?'chosen':''}" aria-pressed="${selectedStarter===i}" onclick="chooseStarter(${i})">${uiEsc(p.name)}<b>${p.q}</b></button>`).join('')}</div>`).join('')}</div>${selectedStarter===null?'':`<h3>Suplentes · ${a.pos}</h3><div class="squad-cards">${s.players.map((p,i)=>({p,i})).filter(x=>!x.p.on&&x.p.pos===a.pos).sort((x,y)=>y.p.q-x.p.q).map(({p,i})=>`<button onclick="swapStarter(${i})">${uiEsc(p.name)} · ${p.q} · Cambiar</button>`).join('')||'<p>No hay suplentes de esta posición.</p>'}</div><button onclick="selectedStarter=null;render()">Cancelar</button>`}`;}
function rosterView(){return `<h2>Plantilla</h2><button class="primary" onclick="go('Tácticas')">Preparar alineación</button>${['POR','DEF','MED','DEL'].map(pos=>`<h3>${pos}</h3><div class="squad-cards">${s.players.map((p,i)=>({p,i})).filter(x=>x.p.pos===pos).map(({p,i})=>`<button class="squad-player" onclick="playerCard(${i})"><span>${uiEsc(p.name)}<small>${p.age} años · ${p.on?'Titular':'Suplente'}</small></span><b>${p.q}</b></button>`).join('')}</div>`).join('')}`;}
