<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>PC Manager 26</title><style>body{margin:0;background:#e5e9e2;color:#182b24;font:15px Arial}header{background:#143e2d;color:white;padding:20px;font-size:24px;font-weight:bold}main{max-width:1000px;margin:auto;padding:16px}nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}button,select{font:inherit;padding:10px;border:1px solid #87998c;border-radius:4px;background:white;color:#183c2c;cursor:pointer}button.primary{background:#17623e;color:white}section{background:white;padding:16px;border:1px solid #aab8ad;margin:10px 0;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}tr:nth-child(even){background:#f0f4ef}small{color:#52665a}h2{margin-top:0}input{max-width:100%}</style><header>PC MANAGER 26 <small style='color:#c3ddca'>· edición clásica</small></header><main id=app></main><script>
const names=['Real Madrid','Barcelona','Atlético','Athletic','Real Sociedad','Betis','Villarreal','Sevilla','Valencia','Celta','Osasuna','Getafe','Rayo','Mallorca','Espanyol','Girona','Alavés','Levante','Elche','Oviedo'];const first=['Álex','Mario','Hugo','Pablo','Lucas','Diego','Iván','Marc','Sergio','David','Adrián','Nico','Jorge','Raúl','Óscar','Dani','Joel','Eric','Rubén','Bruno'];const last=['Vega','Soler','Ramos','Costa','Mora','Vidal','Reyes','Luna','Cano','Ríos','Gil','Sanz','León','Paz','Marín','Cruz','Lara','Roca','Prieto','Blanco'];let s;try{s=JSON.parse(localStorage.getItem('pcm26v1'))}catch{}let tab='Inicio';const app=document.getElementById('app');const rnd=n=>Math.floor(Math.random()*n);const money=n=>Math.round(n).toLocaleString('es-ES')+' €';function player(i,q){return {name:first[rnd(20)]+' '+last[rnd(20)],pos:i<2?'POR':i<9?'DEF':i<16?'MED':'DEL',age:19+rnd(15),q:Math.max(45,Math.min(94,q-8+rnd(17))),on:false}}function schedule(n){let a=Array.from({length:n},(_,i)=>i),r=[];for(let k=0;k<n-1;k++){let p=[];for(let j=0;j<n/2;j++)p.push(k%2?[a[n-1-j],a[j]]:[a[j],a[n-1-j]]);r.push(p);a.splice(1,0,a.pop())}return r.concat(r.map(p=>p.map(([a,b])=>[b,a])))}function start(){let id=+document.getElementById('club').value;s={id,year:2026,week:0,clubs:names.map((name,i)=>({name,q:85-Math.floor(i*.85),p:0,w:0,d:0,l:0,gf:0,ga:0})),players:Array.from({length:22},(_,i)=>player(i,85-Math.floor(id*.85))),cash:12000000,stadium:25000,ticket:25,formation:'4-4-2',market:[],results:[],schedule:schedule(20)};auto();market();save();render()}function save(){try{localStorage.setItem('pcm26v1',JSON.stringify(s))}catch{}}function auto(){s.players.forEach(p=>p.on=false);let f=s.formation.split('-').map(Number);['POR','DEF','MED','DEL'].forEach((pos,i)=>s.players.filter(p=>p.pos===pos).sort((a,b)=>b.q-a.q).slice(0,[1,...f][i]).forEach(p=>p.on=true))}function market(){s.market=Array.from({length:8},(_,i)=>player([0,3,10,18][i%4],65+rnd(18)))}function val(p){return Math.round((p.q-40)**2*3500*(35-p.age)/12)}function strength(i){return i===s.id?s.players.filter(p=>p.on).reduce((a,p)=>a+p.q,0)/11:s.clubs[i].q}function goals(x){let l=Math.exp(-x),p=1,k=0;do{k++;p*=Math.random()}while(p>l);return k-1}function play(){if(s.players.filter(p=>p.on).length!==11){alert('Selecciona exactamente 11 titulares');return}if(s.week===38){s.year++;s.week=0;s.clubs.forEach(c=>Object.assign(c,{p:0,w:0,d:0,l:0,gf:0,ga:0}));s.players=s.players.map((p,i)=>p.age>=36?player(i,65):({...p,age:p.age+1,q:Math.max(45,Math.min(95,p.q+(p.age<25?2:p.age>31?-2:0)))}));s.cash+=5000000;auto();s.results=[];save();render();return}s.results=s.schedule[s.week].map(([a,b])=>{let diff=(strength(a)-strength(b))/18;let x=goals(Math.max(.2,1.5+diff)),y=goals(Math.max(.2,1.1-diff));for(let [i,g,h] of [[a,x,y],[b,y,x]]){let c=s.clubs[i];c.gf+=g;c.ga+=h;c.p+=g>h?3:g===h?1:0;c[g>h?'w':g===h?'d':'l']++}if(a===s.id)s.cash+=Math.round(s.stadium*.75*s.ticket);return {a,b,x,y}});s.cash-=s.players.reduce((a,p)=>a+p.q*95,0);s.week++;market();save();tab='Resultados';render()}function go(t){tab=t;render()}function toggle(i){s.players[i].on=!s.players[i].on;save();render()}function buy(i){let p=s.market[i],v=val(p);if(s.cash<v)return alert('Presupuesto insuficiente');s.cash-=v;s.players.push(p);s.market.splice(i,1);save();render()}function sell(i){if(s.players.length<=11)return alert('Plantilla mínima de 11');s.cash+=val(s.players[i]);s.players.splice(i,1);save();render()}function table(h,rows){return '<table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>'}function render(){if(!s){app.innerHTML='<section><h2>Nueva partida</h2><p>Elige tu club</p><select id=club>'+names.map((n,i)=>`<option value=${i}>${n}</option>`).join('')+'</select> <button class=primary onclick=start()>Empezar</button><p><small>Clubes reales; plantillas y composición de liga ilustrativas.</small></p></section>';return}let c=s.clubs[s.id],rank=[...s.clubs].sort((a,b)=>b.p-a.p||(b.gf-b.ga)-(a.gf-a.ga));let pair=s.schedule[s.week]?.find(p=>p.includes(s.id));app.innerHTML=`<section><h2>${c.name}</h2>${s.year}/${String(s.year+1).slice(-2)} · Jornada ${s.week}/38 · ${rank.indexOf(c)+1}º · Caja: <b>${money(s.cash)}</b></section><nav>${['Inicio','Plantilla','Tácticas','Fichajes','Clasificación','Calendario','Economía','Resultados','Partida'].map(t=>`<button onclick="go('${t}')" class="${tab===t?'primary':''}">${t}</button>`).join('')}</nav><section id=content></section><button class=primary onclick=play()>${s.week===38?'Nueva temporada':'Jugar jornada'}</button>`;let el=document.getElementById('content');if(tab==='Inicio')el.innerHTML=`<h2>Despacho del mánager</h2><p>Próximo partido: <b>${pair?pair.map(i=>s.clubs[i].name).join(' – '):'Temporada finalizada'}</b></p><p>Media del once: ${strength(s.id).toFixed(1)} · Puntos: ${c.p}</p>`;if(tab==='Plantilla'||tab==='Tácticas')el.innerHTML=`<h2>${tab}</h2><select onchange="s.formation=this.value;auto();save();render()">${['4-4-2','4-3-3','3-5-2','5-3-2'].map(f=>`<option ${s.formation===f?'selected':''}>${f}</option>`)}</select> <button onclick="auto();save();render()">Mejor once</button><p>Titulares: ${s.players.filter(p=>p.on).length}/11</p>`+table(['XI','Jugador','Pos','Edad','Media','Valor',''],s.players.map((p,i)=>[`<input type=checkbox ${p.on?'checked':''} onchange=toggle(${i})>`,p.name,p.pos,p.age,p.q,money(val(p)),`<button onclick=sell(${i})>Vender</button>`]));if(tab==='Fichajes')el.innerHTML=table(['Jugador','Pos','Edad','Media','Precio',''],s.market.map((p,i)=>[p.name,p.pos,p.age,p.q,money(val(p)),`<button onclick=buy(${i})>Fichar</button>`]));if(tab==='Clasificación')el.innerHTML=table(['#','Club','PJ','G','E','P','GF','GC','Pts'],rank.map((c,i)=>[i+1,c.name,c.w+c.d+c.l,c.w,c.d,c.l,c.gf,c.ga,c.p]));if(tab==='Calendario')el.innerHTML=table(['Jornada','Local','Visitante'],s.schedule.map((r,i)=>{let [a,b]=r.find(p=>p.includes(s.id));return [i+1,s.clubs[a].name,s.clubs[b].name]}));if(tab==='Resultados')el.innerHTML=table(['Local','Resultado','Visitante'],s.results.map(r=>[s.clubs[r.a].name,r.x+' – '+r.y,s.clubs[r.b].name]));if(tab==='Economía')el.innerHTML=`<h2>Economía y estadio</h2><p>Caja: ${money(s.cash)}</p><p>Aforo: ${s.stadium}</p><p>Salarios por jornada: ${money(s.players.reduce((a,p)=>a+p.q*95,0))}</p><label>Precio entrada <input type=number min=5 max=100 value=${s.ticket} onchange="s.ticket=Math.max(5,Math.min(100,+this.value));save();render()"></label><p><button onclick="if(s.cash>=2000000){s.cash-=2000000;s.stadium+=5000;save();render()}else alert('Fondos insuficientes')">Ampliar 5.000 plazas · 2 M€</button></p>`;if(tab==='Partida')el.innerHTML=`<button onclick=exportGame()>Exportar partida</button> <input type=file accept=.json onchange=importGame(this)> <button onclick="if(confirm('¿Borrar partida?')){localStorage.removeItem('pcm26v1');s=null;render()}">Nueva partida</button>`}function exportGame(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='pcm26-partida.json';a.click()}async function importGame(e){try{let d=JSON.parse(await e.files[0].text());if(!Array.isArray(d.clubs)||!Array.isArray(d.players)||!Array.isArray(d.schedule)||d.clubs.length!==20)throw Error();s=d;save();render()}catch{alert('Partida no válida')}}render();</script></html>
